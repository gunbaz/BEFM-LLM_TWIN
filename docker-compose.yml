version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: llm_twin_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  qdrant:
    image: qdrant/qdrant:latest
    container_name: llm_twin_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongo_data:
    driver: local
  qdrant_data:
    driver: local
