services:
  # MongoDB - Chunk metadata storage
  mongodb:
    image: mongo:latest
    container_name: llm-twin-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - llm-twin-network
    restart: unless-stopped

  # Qdrant - Vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: llm-twin-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - llm-twin-network
    restart: unless-stopped

  # ZenML Server - MLOps pipeline tracking
  zenml:
    image: zenmldocker/zenml-server:0.90.0
    container_name: llm-twin-zenml
    ports:
      - "8080:8080"
    environment:
      - ZENML_STORE_URL=sqlite:////zenml/zenml.db
      - ZENML_SERVER_DEPLOYMENT_TYPE=docker
      - ZENML_DEFAULT_USER_NAME=default
      - ZENML_DEFAULT_USER_PASSWORD=
      - ZENML_LOGGING_VERBOSITY=DEBUG
    volumes:
      - zenml_data:/zenml
    networks:
      - llm-twin-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  qdrant_data:
    driver: local
  zenml_data:
    driver: local

networks:
  llm-twin-network:
    driver: bridge
